mkdir -p scripts && cat > scripts/linux-health-check.sh <<'EOF'
#!/bin/bash

echo "=== Linux Health Check ==="
echo "Hostname: $(hostname)"
echo "Kernel: $(uname -r)"
echo "Uptime: $(uptime -p)"
echo
echo "--- Disk ---"
df -h /
echo
echo "--- Memory ---"
free -h
echo
echo "--- Processes ---"
ps aux --sort=-%cpu | head -n 6
echo
echo "--- Network ---"
ss -tuln
echo
echo "--- Identity ---"
whoami
id
echo
echo "=== Health Check Complete ==="
EOF
chmod +x scripts/linux-health-check.sh
