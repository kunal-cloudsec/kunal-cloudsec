name: Linux CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  linux-check:
    name: Linux Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Linux system check
        run: |
          echo "🐧 Linux CI started"
          echo "Kernel:"
          uname -a
          echo "Operating System:"
          cat /etc/os-release

      - name: Verify project structure
        run: |
          echo "📁 Checking project structure..."

          test -f commands.txt
          test -d logs

          echo "✅ commands.txt found"
          echo "✅ logs directory found"
          echo "✅ Project structure OK"

      - name: Bash syntax validation
        shell: bash
        run: |
          echo "🔍 Checking Bash scripts..."

          mapfile -t scripts < <(find . -type f -name "*.sh" -not -path "./.git/*")

          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "ℹ️ No Bash scripts found"
          else
            for file in "${scripts[@]}"; do
              bash -n "$file"
              echo "✅ $file passed Bash syntax check"
            done
          fi

      - name: Final validation
        run: |
          echo "================================"
          echo "🐧 Linux validation PASSED"
          echo "🔐 DevSecOps CI validation PASSED"
          echo "🚀 Pipeline completed successfully"
          echo "================================"
